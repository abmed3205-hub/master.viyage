<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Voyages - عمرة رمضان المبارك</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #05070b;
            display: flex;
            justify-content: center;
            margin: 0;
            padding: 0;
        }

        /* شاشة البداية بالشعار لمدة نصف ثانية */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }

        #splash-screen img {
            width: 85%;
            max-width: 320px;
            height: auto;
        }
        
        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #05070b;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .banner-box {
            width: 100%;
            background-color: #000;
        }
        
        .banner-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* حاوية زر الواتساب بعرض الشاشة بالكامل وبدون أي فراغات */
        .button-box {
            width: 100%;
            padding: 0;
            background-color: #05070b;
        }

        .whatsapp-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #00b4d8;
            color: #ffffff;
            text-decoration: none;
            width: 100%;
            padding: 18px;
            border-radius: 0;
            font-size: 19px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 180, 216, 0.4);
            text-align: center;
            transition: background 0.2s;
        }

        .whatsapp-btn:active {
            background-color: #0096b4;
        }

        .footer-image-box {
            width: 100%;
            background-color: #000;
        }

        .footer-image-box img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <!-- شاشة البداية بالشعار (تظهر لنصف ثانية ثم تختفي بسلاسة) -->
    <div id="splash-screen">
        <img src="logo.png" alt="Master Voyages Logo">
    </div>

    <div class="app-container">
        
        <!-- 1. الصورة الرئيسية للإعلان -->
        <div class="banner-box">
            <img src="master-omra.jpg" alt="Master Voyages - عمرة رمضان المبارك">
        </div>

        <!-- 2. زر الواتساب المحسّن بعبارة أنيقة واحترافية -->
        <div class="button-box">
            <a href="https://wa.me/22232050583?text=%D8%A7%D9%84%D8%B3%D9%84%D8%A7%D9%85%20%D8%B9%D9%84%D9%8A%D9%83%D9%85%D8%8C%20%D8%A3%D8%B1%D9%8A%D8%AF%20%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D9%81%D8%B3%D8%A7%D8%B1%20%D9%88%D8%AD%D8%AC%D8%B2%20%D8%B1%D8%AD%D9%84%D8%A9%20%D8%B9%D9%85%D8%B1%D8%A9%20%D8%B1%D9%85%D8%B6%D8%A7%D9%86%20%D8%B9%D8%A8%D8%B1%20Master%20Voyages" 
               class="whatsapp-btn" target="_blank">
                احجز رحلتك الإيمانية الآن 🌙
            </a>
        </div>

        <!-- 3. صورة تفاصيل التواصل والموقع -->
        <div class="footer-image-box">
            <img src="omra-footer.jpg" alt="Master Voyages - معلومات التواصل والموقع">
        </div>

    </div>

    <script>
        // إخفاء شاشة البداية بعد نصف ثانية
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                }, 400);
            }, 500);
        });
    </script>
</body>
</html>
