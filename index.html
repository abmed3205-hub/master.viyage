<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Voyages - عمرة رمضان المبارك</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* القضاء التام على الفراغات والبقع السوداء ومنع السحب الفارغ */
        html, body {
            background-color: #000000;
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100vh;
            overscroll-behavior-y: none;
        }

        /* شاشة البداية بالشعار */
        #splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.4s ease;
        }

        #splash-screen img {
            width: 85%;
            max-width: 320px;
            height: auto;
        }
        
        .app-container {
            width: 100%;
            max-width: 480px;
            margin: 0 auto;
            background-color: #000000;
            display: flex;
            flex-direction: column;
        }

        /* حاوية الصور لمنع أي فراغات فاصلة بينها تماماً */
        .image-box {
            width: 100%;
            line-height: 0;
            font-size: 0;
            background-color: #000000;
        }

        .image-box img {
            width: 100%;
            height: auto;
            display: block;
            border: none;
        }

        .image-box a {
            display: block;
            width: 100%;
            line-height: 0;
        }
    </style>
</head>
<body>

    <!-- شاشة البداية بالشعار -->
    <div id="splash-screen">
        <img src="logo.png" alt="Master Voyages Logo">
    </div>

    <div class="app-container">
        
        <!-- 1. الصورة الرئيسية للإعلان -->
        <div class="image-box">
            <img src="master-omra.jpg" alt="Master Voyages - عمرة رمضان المبارك">
        </div>

        <!-- 2. زر الواتساب المصور المحدث بالرقم الصحيح -->
        <div class="image-box">
            <a href="https://wa.me/22224050582?text=%D8%A7%D9%84%D8%B3%D9%84%D8%A7%D9%85%20%D8%B9%D9%84%D9%8A%D9%83%D9%85%D8%8C%20%D8%A3%D8%B1%D9%8A%D8%AF%20%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D9%81%D8%B3%D8%A7%D8%B1%20%D9%88%D8%AD%D8%AC%D8%B2%20%D8%B1%D8%AD%D9%84%D8%A9%20%D8%B9%D9%85%D8%B1%D8%A9%20%D8%B1%D9%85%D8%B6%D8%A7%D9%86%20%D8%B9%D8%A8%D8%B1%20Master%20Voyages" target="_blank">
                <img src="whatsapp-btn.jpg" alt="احجز مقعدك الآن عبر واتساب">
            </a>
        </div>

        <!-- 3. صورة تفاصيل التواصل والموقع والمتاجر في الأسفل مباشرة -->
        <div class="image-box">
            <img src="omra-footer.jpg" alt="Master Voyages - معلومات التواصل والموقع">
        </div>

    </div>

    <script>
        // إخفاء شاشة البداية بعد نصف ثانية بسلاسة
        window.addEventListener('load', () => {
            setTimeout(() => {
                const splash = document.getElementById('splash-screen');
                splash.style.opacity = '0';
                setTimeout(() => {
                    splash.style.display = 'none';
                }, 400);
            }, 500);
        });
    </script>
</body>
</html>
