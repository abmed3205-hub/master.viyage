<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Voyages - عمرة مباركة</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .app-container {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* حاوية الصورة الإعلانية */
        .main-ad-banner {
            width: 100%;
            flex: 1;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .main-ad-banner img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        /* بار زر الواتساب السفلي */
        .bottom-action-bar {
            width: 100%;
            padding: 12px 16px 24px 16px;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* زر الواتساب الأخضر */
        .whatsapp-action-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            background-color: #25d366;
            color: #ffffff;
            text-decoration: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            transition: background 0.2s ease;
            text-align: center;
        }

        .whatsapp-action-btn:active {
            background-color: #1ebe5d;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- الصورة المطابقة تماماً لاسم الملف في المستودع banner.jpg -->
        <div class="main-ad-banner">
            <img src="banner.jpg" alt="Master Voyages - عمرة مباركة">
        </div>

        <!-- زر الاتصال بالواتساب في الأسفل -->
        <div class="bottom-action-bar">
            <a href="https://wa.me/22232050583?text=%D8%A7%D9%84%D8%B3%D9%84%D8%A7%D9%85%20%D8%B9%D9%84%D9%8A%D9%83%D9%85%2C%20%D8%A3%D8%B1%D9%8A%D8%AF%20%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D9%81%D8%B3%D8%A7%D8%B1%20%D9%88%D8%AD%D8%AC%D8%B2%20%D8%B1%D8%AD%D9%84%D8%A7%D8%AA%20%D8%A7%D9%8 فإن%20%D8%A7%D9%84%D8%B9%D9%85%D8%B1%D8%A9" 
               class="whatsapp-action-btn" target="_blank">
                <span>تواصل واحجز عبر واتساب</span>
            </a>
        </div>
    </div>

</body>
</html>
