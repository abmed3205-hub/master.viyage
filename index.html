<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Voyages - عمرة رمضان المبارك</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #05070b;
            display: flex;
            justify-content: center;
            margin: 0;
            padding: 0;
        }
        
        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #05070b;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* حاوية الصورة الرئيسية */
        .banner-box {
            width: 100%;
            background-color: #000;
        }
        
        .banner-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* حاوية زر الواتساب */
        .button-box {
            width: 100%;
            padding: 12px 16px;
            background-color: #05070b;
            display: flex;
            justify-content: center;
        }

        .whatsapp-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #00b4d8;
            color: #ffffff;
            text-decoration: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 180, 216, 0.4);
            text-align: center;
            transition: background 0.2s;
        }

        .whatsapp-btn:active {
            background-color: #0096b4;
        }

        /* حاوية صورة تفاصيل التواصل والسفلية */
        .footer-image-box {
            width: 100%;
            background-color: #000;
        }

        .footer-image-box img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- 1. الصورة الرئيسية للإعلان -->
        <div class="banner-box">
            <img src="master-omra.jpg" alt="Master Voyages - عمرة رمضان المبارك">
        </div>

        <!-- 2. زر الواتساب الأخضر السماوي تحت الصورة مباشرة -->
        <div class="button-box">
            <a href="https://wa.me/22232050583?text=%D8%A7%D9%84%D8%B3%D9%84%D8%A7%D9%85%20%D8%B9%D9%84%D9%8A%D9%83%D9%85%2C%20%D8%A3%D8%B1%D9%8A%D8%AF%20%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D9%81%D8%B3%D8%A7%D8%B1%20%D9%88%D8%AD%D8%AC%D8%B2%20%D8%B1%D8%AD%D9%84%D8%A7%D8%AA%20%D8%B9%D9%85%D8%B1%D8%A9%20%D8%B1%D9%85%D8%B6%D8%A7%D9%86" 
               class="whatsapp-btn" target="_blank">
                احجز مقعدك الآن عبر واتساب
            </a>
        </div>

        <!-- 3. صورة تفاصيل التواصل والموقع ومتاجر التطبيقات تحت الزر مباشرة -->
        <div class="footer-image-box">
            <img src="omra-footer.jpg" alt="Master Voyages - معلومات التواصل والموقع">
        </div>

    </div>

</body>
</html>
