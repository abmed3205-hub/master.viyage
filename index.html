<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Voyages - عمرة رمضان المبارك</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
        }
        
        .app-container {
            width: 100%;
            max-width: 480px;
            background-color: #0b0f19;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 30px;
        }

        /* حاوية الصورة الإعلانية الشاملة */
        .banner-container {
            width: 100%;
            background-color: #000;
        }
        .banner-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* حاوية زر الواتساب مرفوعة مباشرة تحت الصورة */
        .action-container {
            width: 100%;
            padding: 15px 20px;
            background-color: #0b0f19;
            display: flex;
            justify-content: center;
        }

        /* زر الواتساب باللون الأخضر السماوي (Cyan-Green / Turquoise) */
        .whatsapp-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background-color: #00b4d8; /* لون أخضر سماوي / فيروزي مميز ومشرق */
            color: #ffffff;
            text-decoration: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 180, 216, 0.4);
            transition: all 0.2s ease;
            text-align: center;
        }

        .whatsapp-btn:active {
            background-color: #0096b4;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- الصورة الاحترافية الشاملة -->
        .banner-container {
            <img src="master-omra.jpg" alt="Master Voyages - عمرة رمضان المبارك">
        </div>

        <!-- زر الواتساب المباشر تحت الصورة مباشرة باللون الأخضر السماوي -->
        <div class="action-container">
            <a href="https://wa.me/22232050583?text=%D8%A7%D9%84%D8%B3%D9%84%D8%A7%D9%85%20%D8%B9%D9%84%D9%8A%D9%83%D9%85%2C%20%D8%A3%D8%B1%D9%8A%D8%AF%20%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D9%81%D8%B3%D8%A7%D8%B1%20%D9%88%D8%AD%D8%AC%D8%B2%20%D8%B1%D8%AD%D9%84%D8%A7%D8%AA%20%D8%B9%D9%85%D8%B1%D8%A9%20%D8%B1%D9%85%D8%B6%D8%A7%D9%86" 
               class="whatsapp-btn" target="_blank">
                <span>احجز مقعدك الآن عبر واتساب</span>
            </a>
        </div>

    </div>

</body>
</html>
