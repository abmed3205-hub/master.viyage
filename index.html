<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Voyages - عمرة رمضان المبارك</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .app-container {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background-color: #0b0f19;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* حاوية الصورة الإعلانية الشاملة */
        .banner-container {
            width: 100%;
            flex: 1;
            background-color: #000;
        }
        .banner-container img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* حاوية زر الواتساب الثابت في الأسفل */
        .action-container {
            padding: 12px 16px 20px 16px;
            background-color: #0b0f19;
            width: 100%;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
        }

        .whatsapp-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            background-color: #25d366;
            color: #ffffff;
            text-decoration: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
            transition: all 0.2s ease;
            text-align: center;
        }

        .whatsapp-btn:active {
            background-color: #1ebe5d;
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- الصورة الاحترافية الشاملة بالاسم الجديد omra.jpg -->
        <div class="banner-container">
            <img src="omra.jpg" alt="Master Voyages - عمرة رمضان المبارك">
        </div>

        <!-- زر الواتساب البارز والواضح في الأسفل للحجز الفوري -->
        <div class="action-container">
            <a href="https://wa.me/22232050583?text=%D8%A7%D9%84%D8%B3%D9%84%D8%A7%D9%%20%D8%B9%D9%84%D9%8A%D9%83%D9%85%2C%20%D8%A3%D8%B1%D9%8A%D8%AF%20%D8%A7%D9%84%D8%A7%D9%83%D8%AA%20%D9%88%D8%AD%D8%AC%D8%B2%20%D8%B1%D8%AD%D9%84%D8%A7%D8%AA%20%D8%B9%D9%85%D8%B1%D8%Aة" 
               class="whatsapp-btn" target="_blank">
                <span>احجز مقعدك الآن عبر واتساب</span>
            </a>
        </div>

    </div>

</body>
</html>
