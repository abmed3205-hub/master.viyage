<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Master Voyages - حجز عمرة رمضان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: #000000; /* خلفية سوداء نظيفة */
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* الحاوية الرئيسية */
        .app-container {
            width: 100%;
            max-width: 480px; /* مقاس جوال قياسي */
            height: 100vh;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* واجهة الإعلان الرئيسية (الصورة المدمجة) */
        .main-ad-banner {
            width: 100%;
            flex: 1; /* تأخذ المساحة المتبقية */
            position: relative;
            background-color: #000;
        }
        .main-ad-banner img {
            width: 100%;
            height: 100%;
            object-fit: contain; /* تحافظ على تناسب الصورة دون اقتصاص */
            display: block;
        }

        /* حاوية زر الواتساب في الأسفل */
        .bottom-action-bar {
            width: 100%;
            padding: 10px 16px 20px 16px; /* بادينج مناسب للأسفل */
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* زر الواتساب الأخضر الدائري كما طلبت */
        .whatsapp-action-btn {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            background-color: #25d366; /* لون الواتساب */
            color: #ffffff;
            text-decoration: none;
            width: 100%;
            padding: 18px;
            border-radius: 12px; /* زوايا منحنية للزر */
            font-size: 18px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4); /* ظل ناعم للزر */
            transition: background 0.2s ease, transform 0.1s ease;
            text-align: center;
        }

        /* أيقونة الواتساب الدائرية (اختيارية، أضفتها لتعزيز الشكل) */
        .whatsapp-icon {
            width: 28px;
            height: 28px;
            background-color: #fff;
            color: #25d366;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 18px;
            font-weight: bold;
        }

        .whatsapp-action-btn:active {
            background-color: #1ebe5d; /* تغميق عند الضغط */
            transform: scale(0.98); /* تأثير ضغط بسيط */
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- الواجهة الرئيسية: الصورة الإعلانية المدمجة التي تحتوي على كل النصوص والتفاصيل -->
        <div class="main-ad-banner">
            <img src="omra-ad-full.png" alt="Master Voyages - عمرة مباركة - تفاصيل الحجز">
        </div>

        <!-- البار السفلي: يحتوي فقط على زر الاتصال بالواتساب الدائري -->
        <div class="bottom-action-bar">
            <!-- رابط الواتساب المباشر مع الرسالة المجهزة -->
            <a href="https://wa.me/22232050583?text=%D8%A7%D9%84%D8%B3%D9%84%D8%A7%D9%85%20%D8%B9%D9%84%D9%8A%D9%83%D9%85%2C%20%D8%A3%D8%B1%D9%8A%D8%AF%20%D8%A7%D9%84%D8%A7%D8%B3%D8%AA%D9%81%D8%B3%D8%A7%D8%B1%20%D9%88%D8%AD%D8%AC%D8%B2%20%D8%B1%D8%AD%D9%84%D8%A7%D8%AA%20%D8%A7%D9%84%D8%B9%D9%85%D8%B1%D8%A9" 
               class="whatsapp-action-btn" target="_blank">
                <div class="whatsapp-icon">✓</div> <!-- أيقونة دائرية بسيطة -->
                <span>اتصل بنا واحجز عبر واتساب</span>
            </a>
        </div>
    </div>

</body>
</html>
